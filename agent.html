<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kero Remote Desk - Host</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0e1117; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 2rem; width: 100%; max-width: 480px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .id-box { background: #0a0c10; border: 1px solid #30363d; color: #38bdf8; font-size: 1.6rem; font-weight: bold; padding: 0.8rem; border-radius: 8px; margin: 1.2rem 0; letter-spacing: 2px; }
        .status-badge { display: inline-block; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.85rem; font-weight: bold; margin-bottom: 1.2rem; }
        .status-ready { background: #14532d; color: #4ade80; border: 1px solid #22c55e; }
        .btn { width: 100%; padding: 0.9rem; background: #238636; color: #fff; border: none; border-radius: 6px; font-size: 1.05rem; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #2ea043; }
        .log-box { background: #0a0c10; border: 1px solid #30363d; border-radius: 6px; padding: 0.8rem; font-family: monospace; font-size: 0.8rem; color: #8b949e; height: 130px; overflow-y: auto; text-align: left; margin-top: 1.2rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #38bdf8; margin-bottom: 0.3rem;">⚡ Kero Remote Desk</h2>
        <p style="color: #8b949e; font-size: 0.85rem;">Zero-Admin WebRTC Host</p>

        <div class="id-box" id="my-id">Generating ID...</div>

        <div>
            <span class="status-badge status-ready" id="status-text">● Ready for Incoming Connection</span>
        </div>

        <button class="btn" id="btn-start">🛡️ Authorize & Share Screen</button>

        <div class="log-box" id="logs">
            <div>[P2P] Connecting to global WebRTC network...</div>
        </div>
    </div>

    <script>
        const myIdEl = document.getElementById('my-id');
        const statusEl = document.getElementById('status-text');
        const logsEl = document.getElementById('logs');
        const btnStart = document.getElementById('btn-start');

        function log(msg) {
            const div = document.createElement('div');
            div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logsEl.appendChild(div);
            logsEl.scrollTop = logsEl.scrollHeight;
        }

        // Generate persistent 6-digit ID
        let savedId = localStorage.getItem('kero_device_id');
        if (!savedId) {
            savedId = 'kero-' + Math.floor(100000 + Math.random() * 900000);
            localStorage.setItem('kero_device_id', savedId);
        }

        // Connect to local user32.dll mouse/keyboard driver (No Admin Needed!)
        let localDriver = null;
        function connectDriver() {
            localDriver = new WebSocket('ws://127.0.0.1:9999');
            localDriver.onopen = () => log('Native Windows mouse driver connected.');
            localDriver.onclose = () => setTimeout(connectDriver, 2000);
            localDriver.onerror = () => {};
        }
        connectDriver();

        // Initialize PeerJS WebRTC (Outbound only - No Admin / No Firewall Prompts!)
        const peer = new Peer(savedId);

        peer.on('open', (id) => {
            myIdEl.innerText = id.replace('kero-', '');
            log(`Host ready. Your Address: ${id.replace('kero-', '')}`);
        });

        let localStream = null;

        btnStart.addEventListener('click', async () => {
            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { frameRate: 60, cursor: 'always', width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });

                log('Screen sharing authorized (60 FPS 1080p).');
                btnStart.disabled = true;
                btnStart.innerText = '✓ Screen Active & Streaming';
                btnStart.style.background = '#30363d';
            } catch (err) {
                log(`Authorization failed: ${err.message}`);
            }
        });

        // Answer incoming calls
        peer.on('call', (call) => {
            if (!localStream) {
                alert('Please click "Authorize & Share Screen" first!');
                return;
            }
            log(`Incoming connection from: ${call.peer}`);
            call.answer(localStream);
            statusEl.innerText = '● Connected (Streaming Live)';
        });

        // Receive remote mouse/keyboard commands over direct P2P DataChannel
        peer.on('connection', (conn) => {
            log('Direct P2P DataChannel opened.');
            conn.on('data', (data) => {
                if (localDriver && localDriver.readyState === WebSocket.OPEN) {
                    localDriver.send(data);
                }
            });
        });

        peer.on('error', (err) => log(`Network Error: ${err.type}`));
    </script>
</body>
</html>
