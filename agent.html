
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Agent - Screen Broadcaster</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #090a0f;
        }
        .agent-card {
            background: #1a1d24;
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid #334155;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .status-dot {
            width: 14px;
            height: 14px;
            background: #eab308;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-dot.active { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .log-box {
            background: #0f1117;
            padding: 1rem;
            border-radius: 6px;
            text-align: left;
            font-family: monospace;
            font-size: 0.85rem;
            color: #94a3b8;
            height: 150px;
            overflow-y: auto;
            margin-top: 1.5rem;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>
    <div class="agent-card">
        <h2>Windows Remote Agent</h2>
        <p style="color: #94a3b8; margin-top: 0.3rem;">Device ID: <strong id="dev-id" style="color: #fff;">dev-001</strong> (Office-PC)</p>
        
        <div style="margin: 1.5rem 0; font-size: 1rem;">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Ready to authorize</span>
        </div>

        <button id="btn-share" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem;">
            Authorize & Share Screen
        </button>

        <div class="log-box" id="log-box">
            <div>[Agent] Standing by...</div>
        </div>
    </div>

    <script type="module">
        import { SignalingSocket } from './js/websocket.js';

        // UPDATE WITH YOUR CURRENT TUNNEL URL
        const TUNNEL_URL = 'wss://YOUR-CURRENT-TUNNEL-URL.lhr.life';
        const DEVICE_ID = 'dev-001';

        const btnShare = document.getElementById('btn-share');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const logBox = document.getElementById('log-box');

        function log(msg) {
            const el = document.createElement('div');
            el.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logBox.appendChild(el);
            logBox.scrollTop = logBox.scrollHeight;
        }

        let localStream = null;
        let peerConnection = null;
        const signaling = new SignalingSocket(TUNNEL_URL, 'agent', DEVICE_ID);

        btnShare.addEventListener('click', async () => {
            try {
                // Native Screen Capture via Browser (No Admin Rights needed!)
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { frameRate: 60, cursor: "always" },
                    audio: false
                });

                log('Screen capture authorized by user!');
                statusDot.className = 'status-dot active';
                statusText.innerText = 'Broadcasting Screen...';
                btnShare.disabled = true;
                btnShare.innerText = 'Screen Active (Streaming)';

                // Connect to signaling server
                signaling.connect();
            } catch (err) {
                log(`Authorization rejected: ${err.message}`);
            }
        });

        signaling.onMessage = async (data) => {
            if (data.type === 'webrtc_offer') {
                log('Received WebRTC Offer from Controller!');
                
                peerConnection = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                // Attach screen tracks to WebRTC
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                // Gather ICE Candidates to send back
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        signaling.send({
                            type: 'ice_candidate',
                            targetId: data.fromId,
                            candidate: event.candidate
                        });
                    }
                };

                // Listen for DataChannel (Mouse/Keyboard input commands)
                peerConnection.ondatachannel = (event) => {
                    log('DataChannel established with Controller!');
                    const dc = event.channel;
                    dc.onmessage = (e) => {
                        log(`Remote Input received: ${e.data}`);
                    };
                };

                // Set Remote Description (Offer) & Create Answer
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                log('Created WebRTC Answer, sending to Controller...');
                signaling.send({
                    type: 'webrtc_answer',
                    targetId: data.fromId,
                    sdp: answer
                });
            } else if (data.type === 'ice_candidate') {
                if (peerConnection) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                }
            }
        };
    </script>
</body>
</html>
