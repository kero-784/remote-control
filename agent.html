<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kero Remote Desk - P2P Host</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0e1117; }
        .agent-card { background: #161b22; padding: 2.5rem; border-radius: 12px; border: 1px solid #30363d; width: 100%; max-width: 520px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .status-dot { width: 12px; height: 12px; background: #eab308; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .status-dot.active { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .driver-badge { font-size: 0.8rem; padding: 0.35rem 0.7rem; border-radius: 4px; display: inline-block; margin-top: 0.5rem; }
        .driver-ok { background: #14532d; color: #4ade80; border: 1px solid #22c55e; }
        .driver-wait { background: #78350f; color: #fde047; border: 1px solid #eab308; }
        .log-box { background: #0a0c10; padding: 1rem; border-radius: 6px; font-family: Consolas, monospace; font-size: 0.8rem; color: #8b949e; height: 160px; overflow-y: auto; margin-top: 1.5rem; border: 1px solid #30363d; }
    </style>
</head>
<body>
    <div class="agent-card">
        <h2 style="margin-bottom: 0.5rem; color: #38bdf8;">⚡ Kero Remote Desk</h2>
        <p style="color: #8b949e; font-size: 0.9rem;">Device ID: <strong style="color: #fff;">dev-001</strong> (Direct WebRTC P2P)</p>
        
        <div style="margin: 1rem 0;">
            <div id="driver-status" class="driver-badge driver-wait">Native Input Driver: Connecting...</div>
        </div>

        <div style="margin: 1rem 0;">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text" style="font-weight: 600;">Ready to Authorize</span>
        </div>

        <button id="btn-share" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1.05rem; font-weight: bold; background: #238636; border: none; cursor: pointer;">
            🛡️ Authorize & Start 60 FPS P2P Session
        </button>

        <div class="log-box" id="log-box">
            <div>[P2P] STUN NAT Traversal Engine Ready.</div>
        </div>
    </div>

    <script type="module">
        import { SignalingSocket } from './js/websocket.js';

        const DEVICE_ID = 'dev-001';

        const btnShare = document.getElementById('btn-share');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const driverStatus = document.getElementById('driver-status');
        const logBox = document.getElementById('log-box');

        function log(msg) {
            const el = document.createElement('div');
            el.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logBox.appendChild(el);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Connect to local mouse/keyboard driver
        let localDriverWs = null;
        function connectLocalDriver() {
            localDriverWs = new WebSocket('ws://127.0.0.1:9999');
            localDriverWs.onopen = () => {
                driverStatus.className = 'driver-badge driver-ok';
                driverStatus.innerText = '✓ Native Input Driver: Active on Port 9999';
                log('Native Input Driver connected.');
            };
            localDriverWs.onclose = () => {
                driverStatus.className = 'driver-badge driver-wait';
                driverStatus.innerText = '⚠ Native Input Driver: Disconnected (Run node agent.js)';
                setTimeout(connectLocalDriver, 3000);
            };
            localDriverWs.onerror = () => {};
        }
        connectLocalDriver();

        let localStream = null;
        let peerConnection = null;
        const signaling = new SignalingSocket('', 'agent', DEVICE_ID);

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun.cloudflare.com:3478' }
            ]
        };

        btnShare.addEventListener('click', async () => {
            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { frameRate: 60, cursor: 'always', width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });

                log('Screen capture authorized.');
                statusDot.className = 'status-dot active';
                statusText.innerText = 'P2P Broadcaster Active (60 FPS)';
                btnShare.disabled = true;
                btnShare.innerText = 'Broadcasting Active';

                signaling.connect();
            } catch (err) {
                log(`Capture rejected: ${err.message}`);
            }
        });

        signaling.onMessage = async (data) => {
            if (data.type === 'webrtc_offer') {
                log('Received WebRTC Offer from Controller!');
                peerConnection = new RTCPeerConnection(rtcConfig);

                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        signaling.sendToController(DEVICE_ID, {
                            type: 'ice_candidate',
                            candidate: event.candidate
                        });
                    }
                };

                peerConnection.oniceconnectionstatechange = () => {
                    log(`Direct ICE State: ${peerConnection.iceConnectionState}`);
                };

                peerConnection.ondatachannel = (event) => {
                    const channel = event.channel;
                    log(`Direct P2P DataChannel opened: ${channel.label}`);

                    channel.onmessage = (e) => {
                        if (localDriverWs && localDriverWs.readyState === WebSocket.OPEN) {
                            localDriverWs.send(e.data);
                        }
                    };
                };

                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                log('Sent WebRTC Answer. Direct P2P link establishing...');
                signaling.sendToController(DEVICE_ID, {
                    type: 'webrtc_answer',
                    sdp: answer
                });
            } else if (data.type === 'ice_candidate') {
                if (peerConnection) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                }
            }
        };
    </script>
</body>
</html>
