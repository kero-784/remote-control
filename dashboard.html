
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Desk - Dashboard</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="brand">Remote Desk</div>
            <nav class="sidebar-nav">
                <a href="#" class="active">My Computers</a>
                <a href="#">Recent Connections</a>
                <a href="#">Settings</a>
            </nav>
            <div class="sidebar-footer">
                <button id="logout-btn" class="btn btn-danger">Logout</button>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="topbar">
                <h2>My Computers</h2>
                <div class="topbar-actions">
                    <span class="user-badge" id="user-email-display">user@example.com</span>
                </div>
            </header>
            
            <div class="stats-row">
                <div class="stat-card">
                    <h3>Online</h3>
                    <p id="stat-online">0</p>
                </div>
                <div class="stat-card">
                    <h3>Offline</h3>
                    <p id="stat-offline">0</p>
                </div>
            </div>

            <div class="computers-grid" id="computers-grid">
                <!-- Populated by JS -->
            </div>
        </main>
    </div>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
