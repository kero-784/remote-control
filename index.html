<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kero Remote Desk</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0e1117; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1rem; }
        .container { width: 100%; max-width: 440px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .title { color: #38bdf8; font-size: 1.5rem; font-weight: bold; margin-bottom: 0.5rem; text-align: center; }
        .sub { color: #8b949e; font-size: 0.85rem; text-align: center; margin-bottom: 1.5rem; }
        .input-box { width: 100%; padding: 0.85rem; background: #0a0c10; border: 1px solid #30363d; color: #fff; border-radius: 6px; font-size: 1.3rem; font-weight: bold; text-align: center; margin-bottom: 1rem; letter-spacing: 2px; }
        .input-box:focus { outline: none; border-color: #38bdf8; }
        .btn { width: 100%; padding: 0.9rem; background: #238636; color: #fff; border: none; border-radius: 6px; font-size: 1.05rem; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #2ea043; }
        .footer { margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">⚡ Kero Remote Desk</div>
        <div class="sub">Enter Remote Target Address to Connect</div>

        <input type="text" id="target-id" class="input-box" placeholder="e.g. 583921">
        <button id="btn-connect" class="btn">⚡ Connect & Control</button>

        <div class="footer">
            To allow remote control of this PC, open <a href="agent.html" style="color: #38bdf8; text-decoration: none;">Host Agent</a>
        </div>
    </div>

    <script>
        document.getElementById('btn-connect').addEventListener('click', () => {
            const rawId = document.getElementById('target-id').value.trim();
            if (!rawId) {
                alert('Please enter a target ID.');
                return;
            }
            window.location.href = `remote.html?id=${encodeURIComponent(rawId)}`;
        });
    </script>
</body>
</html>
