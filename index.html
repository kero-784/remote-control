
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Desk - Loading</title>
    <link rel="manifest" href="manifest.json">
    <script type="module">
        import { isAuthenticated } from './js/auth.js';
        
        // Bootstrapper: Redirect based on auth state
        window.onload = () => {
            if (isAuthenticated()) {
                window.location.replace('./dashboard.html');
            } else {
                window.location.replace('./login.html');
            }
        };
    </script>
</head>
<body style="background: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;">
    <h2>Loading...</h2>
</body>
</html>
